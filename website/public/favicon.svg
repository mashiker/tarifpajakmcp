<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background — deep teal-ink (brand accent) -->
  <rect width="64" height="64" rx="14" fill="#0E5E58"/>

  <!-- Abstract % mark: two dots + diagonal slash, geometric & clean -->
  <!-- Top-left dot -->
  <circle cx="23" cy="23" r="6" fill="#FFFFFF"/>
  <!-- Bottom-right dot -->
  <circle cx="41" cy="41" r="6" fill="#FFFFFF"/>
  <!-- Diagonal slash between the dots (the % stem), centered, rotated 45deg -->
  <rect x="30.25" y="22" width="3.5" height="20" rx="1.75" transform="rotate(45 32 32)" fill="#FFFFFF"/>
</svg>

