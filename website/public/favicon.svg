<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background — deep teal-ink (brand accent) -->
  <rect width="64" height="64" rx="14" fill="#0E5E58"/>

  <!-- Document card (database / reference metaphor) -->
  <path d="M17 11 H40 L48 19 V51 a3 3 0 0 1-3 3 H17 a3 3 0 0 1-3-3 V14 a3 3 0 0 1 3-3 Z" fill="#FFFFFF"/>
  <!-- Folded corner (negative space cut into the card) -->
  <path d="M40 11 V17 a2 2 0 0 0 2 2 H48 Z" fill="#0E5E58" opacity="0.4"/>

  <!-- Bold, unmistakable % mark = "tarif" / rate -->
  <circle cx="24" cy="22" r="4" fill="#0E5E58"/>
  <circle cx="39" cy="37" r="4" fill="#0E5E58"/>
  <rect x="29" y="16" width="4.6" height="27" rx="2.3" transform="rotate(45 31.3 29.5)" fill="#0E5E58"/>

  <!-- Data rows = lookup table / database -->
  <rect x="20" y="44" width="24" height="2.2" rx="1.1" fill="#0E5E58" opacity="0.55"/>
  <rect x="20" y="48.5" width="16" height="2.2" rx="1.1" fill="#0E5E58" opacity="0.4"/>
</svg>
